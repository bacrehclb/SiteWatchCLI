[project]
name = "sitewatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bacrehclb", email = "j9009308@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
sitewatchcli = "sitewatch:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
